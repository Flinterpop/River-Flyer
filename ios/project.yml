# XcodeGen spec for the iPad / iPhone app. make-ios.sh fills in __VERSION__,
# __BUILD__ and __TEAM__ and runs `xcodegen generate` to produce
# RiverFlyer.xcodeproj; the project file itself is never committed.
name: RiverFlyer
options:
  bundleIdPrefix: ca.rabidfox
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad
    MARKETING_VERSION: "__VERSION__"
    CURRENT_PROJECT_VERSION: "__BUILD__"
    DEVELOPMENT_TEAM: "__TEAM__"
    CODE_SIGN_STYLE: Automatic

targets:
  RiverFlyer:
    type: application
    platform: iOS
    sources:
      - path: RiverFlyer
        excludes:
          - "web"
          - "web/**"
      - path: RiverFlyer/web            # the three Emscripten files, copied in by make-ios.sh
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.rabidfox.riverflyer
        PRODUCT_NAME: River Flyer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: RiverFlyer/Info.plist
      properties:
        CFBundleDisplayName: River Flyer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
